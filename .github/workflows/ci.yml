name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install --no-audit --no-fund

            - name: Lint
              run: npm run lint

            - name: Type check (svelte + ts)
              run: npm run check

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build
